<link rel="icon" href="/assets/brand/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/brand/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" sizes="180x180">
<meta name="theme-color" content="#09163c">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studio H">
<meta property="og:title" content="You're invited to Hollowmere!">
<meta property="og:description" content="Install Hollowmere: Cozy Witch Farm, open Friends and enter your friend's code.">
<meta property="og:image" content="https://studiohgames.com/hollowmere/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Saira:wght@700&family=Grenze+Gotisch&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
  /* Invite landing page: Hollowmere hero art, friend code and store buttons. */
  .game-hero { --hero-img: url('/hollowmere/shots/farm-wide.webp'); text-align: center; }
  .game-hero h1.invite-title { font-size: clamp(2.4rem, 11vw, 4.6rem); line-height: 1.05; }
  .invite-code { margin: 22px auto 0; max-width: 26rem; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .25); border-radius: 14px; padding: 16px; }
  .invite-code p { margin: 0; color: #eef2fb; }
  .invite-code .code { display: block; margin: 6px 0 12px; font: 700 clamp(2.4rem, 13vw, 3.4rem)/1.1 var(--font-title); letter-spacing: .14em; color: var(--gold); user-select: all; }
  .invite-steps { font-size: 1.1rem; color: #eef2fb; margin: 20px auto 22px; max-width: 26em; }
  .game-hero .store-row { justify-content: center; }
  .invite-privacy { margin: 22px 0 0; font-size: .9rem; }
  .invite-privacy a { color: #b9c3df; }
  .copy-done { display: block; min-height: 1.3em; margin-top: 6px; font-size: .9rem; color: #b9c3df; }
  .site-footer { margin-top: 0; }
  .game-hero { min-height: calc(100vh - 64px); }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><img src="/assets/brand/icon.svg" alt="" width="40" height="40"><span>Studio H</span></a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Home</a>
      <a href="/hollowmere/">Hollowmere</a>
    </nav>
  </div>
</header>

<main id="main">
  <section class="game-hero" aria-labelledby="invite-title">
    <div class="wrap">
      <h1 id="invite-title" class="invite-title">You're invited to Hollowmere!</h1>
      <div class="invite-code" id="code-block" hidden>
        <p>Your friend's code: <span class="code" id="code"></span></p>
        <button class="btn" type="button" id="copy">Copy code</button><span class="copy-done" id="copied" aria-live="polite"></span>
      </div>
      <p class="invite-steps" id="steps">Install the game, open Friends and enter your friend's code.</p>
      <div class="store-row">
        <a class="store-badge" href="https://apps.apple.com/us/app/hollowmere-cozy-witch-farm/id6826611308" aria-label="Download Hollowmere on the App Store">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.8-1.1-2.9-4.3zM13.9 5.2c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.1 1.1.1 2.3-.6 3.1-1.5z"/></svg>
          <span><small>Download on the</small><b>App Store</b></span>
        </a>
        <a class="store-badge" href="https://play.google.com/store/apps/details?id=com.camelotcoding.hollowmere" aria-label="Get Hollowmere on Google Play">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.6 1.8c-.3.3-.4.7-.4 1.2v18c0 .5.1.9.4 1.2l10-10.2zM14.9 13.3l2.8 2.8-11.5 6.6c-.6.4-1.2.4-1.7.1zM18.9 9.1l3 1.7c.9.5.9 1.9 0 2.4l-3 1.7-3-3zM4.5 1.2c.5-.3 1.1-.3 1.7.1l11.5 6.6-2.8 2.8z"/></svg>
          <span><small>Get it on</small><b>Google Play</b></span>
        </a>
      </div>
      <p class="invite-privacy"><a href="/hollowmere/privacy/">Privacy Policy</a></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© 2026 Studio H · Colorado, USA</p>
    <nav aria-label="Footer">
      <a href="/hollowmere/">Hollowmere</a>
      <a href="/hollowmere/privacy/">Privacy</a>
      <a href="/hollowmere/terms/">Terms</a>
    </nav>
  </div>
</footer>

<script>
  (function () {
    var ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    var raw = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
    var valid = raw.length === 6 && raw.split('').every(function (ch) { return ALPHABET.indexOf(ch) !== -1; });
    if (!valid) return;
    document.getElementById('code').textContent = raw;
    document.getElementById('steps').textContent = 'Install the game, open Friends and enter this code.';
    document.getElementById('code-block').hidden = false;
    var done = document.getElementById('copied');
    function selectFallback() {
      var ta = document.createElement('textarea');
      ta.value = raw; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done.textContent = ok ? 'Copied!' : '';
    }
    document.getElementById('copy').addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(raw).then(function () { done.textContent = 'Copied!'; }, selectFallback);
      } else {
        selectFallback();
      }
    });
  })();
</script>
</body>
</html>
